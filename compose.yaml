name: cargo-editor
services:
  editor:
    image: ${CARGO_EDITOR_IMAGE:-cargo-editor:local}
    build:
      context: .
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
