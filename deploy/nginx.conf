server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://cargo-api.dreamislandstudio.de; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # Modules use stable filenames. Revalidate all assets after deployment to
    # prevent old rules running with a new UI; no service worker cache.
    add_header Cache-Control "no-cache, must-revalidate" always;
    location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
